<div class="mx-auto flex w-full max-w-xl flex-col gap-4">
	<div class="flex items-center gap-2">
		<p-button icon="pi pi-arrow-left" variant="text" styleClass="min-h-11 min-w-11" ariaLabel="Voltar" (onClick)="voltar()" />
		<h1 class="m-0 text-xl font-semibold">{{ id ? 'Editar lançamento' : 'Novo lançamento' }}</h1>
	</div>

	<app-estado [modo]="estado()" mensagemErro="Não foi possível carregar o lançamento." (recarregar)="carregar()"></app-estado>

	<form *ngIf="estado() === 'carregado'" [formGroup]="formulario" (ngSubmit)="salvar()" class="flex flex-col gap-4" novalidate>
		<div class="flex flex-col gap-1">
			<span id="lancamento-tipo-label" class="text-sm font-medium">Tipo *</span>
			<p-selectButton
				formControlName="kind"
				[options]="opcoesTipo"
				optionLabel="label"
				optionValue="valor"
				[allowEmpty]="false"
				ariaLabelledBy="lancamento-tipo-label"
				styleClass="tipo-lancamento"
			/>
		</div>

		<div class="flex flex-col gap-1">
			<label for="lancamento-descricao" class="text-sm font-medium">Descrição *</label>
			<input
				pInputText
				id="lancamento-descricao"
				formControlName="description"
				maxlength="120"
				autocomplete="off"
				placeholder="Ex.: aluguel, conta de luz, retirada"
				class="min-h-11 w-full"
			/>
			<small *ngIf="invalido('description')" class="text-red-600">Informe a descrição (até 120 caracteres).</small>
		</div>

		<div class="grid grid-cols-2 gap-3">
			<div class="flex min-w-0 flex-col gap-1">
				<label for="lancamento-valor" class="text-sm font-medium">Valor *</label>
				<p-inputNumber
					formControlName="amount"
					inputId="lancamento-valor"
					mode="currency"
					currency="BRL"
					locale="pt-BR"
					[min]="0"
					[max]="valorMaximo"
					[fluid]="true"
					inputStyleClass="min-h-11"
					placeholder="R$ 0,00"
				/>
			</div>
			<div class="flex min-w-0 flex-col gap-1">
				<label for="lancamento-data" class="text-sm font-medium">Data *</label>
				<input pInputText id="lancamento-data" type="date" formControlName="entry_date" class="min-h-11 w-full min-w-0" />
			</div>
		</div>
		<small *ngIf="invalido('amount')" class="-mt-2 text-red-600">Informe um valor maior que zero.</small>
		<small *ngIf="invalido('entry_date')" class="-mt-2 text-red-600">Informe a data.</small>

		<div class="flex flex-col gap-1">
			<label for="lancamento-observacao" class="text-sm font-medium">Observação</label>
			<input pInputText id="lancamento-observacao" formControlName="notes" maxlength="300" autocomplete="off" class="min-h-11 w-full" />
		</div>

		<p-button type="submit" label="Salvar" icon="pi pi-check" styleClass="w-full min-h-11" [loading]="salvando()" />
		<p-button
			*ngIf="lancamento()"
			label="Excluir lançamento"
			icon="pi pi-trash"
			variant="text"
			severity="danger"
			styleClass="w-full min-h-11"
			[disabled]="salvando()"
			(onClick)="confirmarExclusao()"
		/>
	</form>
</div>

<p-confirmDialog [style]="{ width: '100vw', maxWidth: '24rem' }" />
